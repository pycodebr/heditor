name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python syntax
        run: python -m py_compile skills/heditor/scripts/*.py skills/heditor/scripts/reelkit/*.py skills/heditor/templates/*.py skills/heditor/templates/long/*.py
      - name: Shell syntax
        run: bash -n install.sh && bash -n skills/heditor/scripts/setup.sh && bash -n skills/heditor/scripts/heditor
      - name: YAML parser
        run: pip install pyyaml
      - name: SKILL.md frontmatter and catalog
        run: |
          python - <<'PY'
          import json, re, pathlib
          import yaml
          s = pathlib.Path("skills/heditor/SKILL.md").read_text(encoding="utf-8")
          fm = yaml.safe_load(re.match(r"^---\n(.*?)\n---\n", s, re.S).group(1))
          assert isinstance(fm, dict), "frontmatter is not a YAML mapping"
          assert fm["name"] == "heditor", fm.get("name")
          assert isinstance(fm["description"], str) and fm["description"].startswith("Use when"), "description"
          assert re.fullmatch(r"\d+\.\d+\.\d+", str(fm["metadata"]["version"])), fm["metadata"]
          assert f"## {fm['metadata']['version']} " in pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          cat = json.loads(pathlib.Path("skills/heditor/assets/catalog.json").read_text())
          assert cat["music"] and cat["sfx"]
          styles = sorted(p.stem for p in pathlib.Path("skills/heditor/references/styles").glob("*.md") if p.stem != "INDEX")
          idx = pathlib.Path("skills/heditor/references/styles/INDEX.md").read_text()
          assert all(f"`{x}`" in idx for x in styles), styles
          print("ok", len(styles), "styles")
          PY
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python deps
        run: pip install numpy pillow pytest opencv-python-headless
      - name: Unit tests (formats, style packs, long form, mix profiles, reacao, triage, splice, stock, heygen, prepare, gen, study)
        run: cd skills/heditor/scripts/reelkit && python -m pytest -q test_formats.py test_longform.py test_mix.py test_reacao.py test_triage.py test_splice.py test_stock.py test_heygen.py test_prepare_cut.py test_gen.py test_study.py test_sfx_sources.py
